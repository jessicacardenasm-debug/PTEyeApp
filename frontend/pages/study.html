<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OcularGuard — Estudio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../assets/css/custom.css">
</head>
<body class="min-h-screen bg-slate-100 flex items-center justify-center p-4">

  <div x-data="studyApp()" class="w-full max-w-sm bg-white rounded-2xl shadow-lg overflow-hidden">

    <!-- Header -->
    <div class="header-gradient px-6 py-4 flex items-center justify-between text-white">
      <div>
        <p class="text-xs font-semibold uppercase tracking-widest opacity-80">Estudio Detallado</p>
        <p class="text-sm font-bold mt-0.5" x-text="patientLabel">Paciente ID: —</p>
      </div>
      <button @click="api.logout()" class="text-white opacity-70 hover:opacity-100">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
        </svg>
      </button>
    </div>

    <div class="px-6 py-5 space-y-4">

      <!-- Patient ID -->
      <div>
        <label class="block text-xs font-medium text-slate-500 mb-1">ID de Paciente</label>
        <input
          x-model="patientId"
          @input="patientLabel = patientId ? 'Paciente ID: ' + patientId : 'Paciente ID: —'"
          type="text"
          placeholder="Ej: PAC-00123"
          required
          class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-teal-400"
        />
      </div>

      <!-- Image upload -->
      <div>
        <label class="block text-xs font-medium text-slate-500 mb-1">Imagen Ocular</label>
        <div
          @click="$refs.fileInput.click()"
          @dragover.prevent
          @drop.prevent="handleDrop($event)"
          class="border-2 border-dashed border-slate-200 rounded-xl overflow-hidden cursor-pointer hover:border-teal-400 transition"
        >
          <img
            x-show="previewUrl"
            :src="previewUrl"
            class="eye-preview w-full object-cover"
            alt="Vista previa"
          />
          <div x-show="!previewUrl" class="flex flex-col items-center justify-center py-10 text-slate-400">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 mb-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
            </svg>
            <p class="text-xs">Toca para cargar imagen</p>
            <p class="text-xs opacity-60">JPG, PNG — fondo de ojo</p>
          </div>
        </div>
        <input x-ref="fileInput" type="file" accept="image/*" class="hidden" @change="handleFile($event)">
      </div>

      <!-- Change image button (shown after upload) -->
      <button
        x-show="previewUrl"
        @click="$refs.fileInput.click()"
        type="button"
        class="w-full border border-slate-200 text-slate-600 text-sm font-medium py-2 rounded-lg hover:bg-slate-50 transition flex items-center justify-center gap-2"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/>
        </svg>
        CAMBIAR IMAGEN
      </button>

      <!-- Error -->
      <p x-show="error" x-text="error" class="text-xs text-red-500 text-center bg-red-50 rounded-lg px-3 py-2"></p>

      <!-- Analyze button -->
      <button
        @click="analyze"
        :disabled="loading || !imageFile || !patientId"
        class="w-full header-gradient text-white font-semibold py-2.5 rounded-lg text-sm hover:opacity-90 transition disabled:opacity-50 flex items-center justify-center gap-2"
      >
        <svg x-show="!loading" xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/>
        </svg>
        <span x-show="!loading">ANALIZAR CON IA</span>
        <span x-show="loading">Analizando...</span>
      </button>

    </div>

    <!-- Bottom nav -->
    <nav class="border-t border-slate-100 flex text-slate-400 text-xs">
      <a href="study.html" class="flex-1 flex flex-col items-center py-3 text-teal-600">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
        Casos
      </a>
      <a href="#" class="flex-1 flex flex-col items-center py-3 hover:text-teal-500">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/></svg>
        Alertas
      </a>
      <a href="#" class="flex-1 flex flex-col items-center py-3 hover:text-teal-500">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
        Config
      </a>
    </nav>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
  <script src="../assets/js/api.js"></script>
  <script>
    function studyApp() {
      return {
        patientId: "",
        patientLabel: "Paciente ID: —",
        imageFile: null,
        previewUrl: null,
        loading: false,
        error: "",
        init() {
          api.requireAuth();
        },
        handleFile(e) {
          const file = e.target.files[0];
          if (!file) return;
          this.imageFile = file;
          this.previewUrl = URL.createObjectURL(file);
        },
        handleDrop(e) {
          const file = e.dataTransfer.files[0];
          if (!file) return;
          this.imageFile = file;
          this.previewUrl = URL.createObjectURL(file);
        },
        async analyze() {
          if (!this.imageFile || !this.patientId) return;
          this.error = "";
          this.loading = true;
          try {
            const result = await api.analyze(this.patientId, this.imageFile);
            api.saveResult(result);
            window.location.href = "results.html";
          } catch (e) {
            this.error = e.message;
          } finally {
            this.loading = false;
          }
        },
      };
    }
  </script>
</body>
</html>
