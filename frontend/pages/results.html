<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OcularGuard — Resultado</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../assets/css/custom.css">
</head>
<body class="min-h-screen bg-slate-100 flex items-center justify-center p-4">

  <div x-data="resultApp()" class="w-full max-w-sm bg-white rounded-2xl shadow-lg overflow-hidden">

    <!-- Header -->
    <div class="header-gradient px-6 py-4 flex items-center justify-between text-white">
      <div>
        <p class="text-xs font-semibold uppercase tracking-widest opacity-80">Resultado</p>
        <p class="text-sm font-bold mt-0.5" x-text="patientLabel">Paciente ID: —</p>
      </div>
      <button @click="api.logout()" class="text-white opacity-70 hover:opacity-100">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
        </svg>
      </button>
    </div>

    <!-- Solo la enfermedad detectada -->
    <div class="px-6 py-12 flex flex-col items-center text-center fade-in">
      <p class="text-xs font-medium text-slate-400 uppercase tracking-widest mb-3">Enfermedad detectada</p>
      <p class="text-2xl font-bold text-slate-800" x-text="condition">—</p>
    </div>

    <!-- Volver -->
    <div class="px-6 pb-6">
      <a href="study.html"
         class="block w-full text-center header-gradient text-white font-semibold py-2.5 rounded-lg text-sm hover:opacity-90 transition">
        NUEVO ANÁLISIS
      </a>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
  <script src="../assets/js/api.js"></script>
  <script>
    function resultApp() {
      return {
        condition: "—",
        patientLabel: "Paciente ID: —",
        init() {
          api.requireAuth();
          const result = api.getResult();
          if (!result) {
            window.location.href = "study.html";
            return;
          }
          this.condition = result.condition;
          this.patientLabel = "Paciente ID: " + result.patient_id;
        },
      };
    }
  </script>
</body>
</html>
