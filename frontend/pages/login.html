<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OcularGuard — Acceso Clínico</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../assets/css/custom.css">
</head>
<body class="min-h-screen bg-slate-100 flex items-center justify-center p-4">

  <div x-data="loginApp()" class="w-full max-w-sm bg-white rounded-2xl shadow-lg overflow-hidden">

    <!-- Header -->
    <div class="header-gradient px-6 py-5 text-center text-white">
      <p class="text-xs font-semibold uppercase tracking-widest opacity-80">Acceso Clínico</p>
      <h1 class="text-2xl font-bold mt-1">OcularGuard</h1>
      <p class="text-xs opacity-70 mt-1">Plataforma de Diagnóstico Ocular IA</p>
    </div>

    <!-- Form -->
    <form @submit.prevent="submit" class="px-6 py-7 space-y-4">

      <div>
        <label class="block text-xs font-medium text-slate-500 mb-1">Correo Institucional</label>
        <input
          x-model="email"
          type="email"
          placeholder="dr.nombre@institucion.com"
          required
          class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-teal-400"
        />
      </div>

      <div>
        <label class="block text-xs font-medium text-slate-500 mb-1">Contraseña</label>
        <div class="relative">
          <input
            x-model="password"
            :type="showPassword ? 'text' : 'password'"
            placeholder="••••••••"
            required
            class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-teal-400 pr-10"
          />
          <button
            type="button"
            @click="showPassword = !showPassword"
            class="absolute right-3 top-2 text-slate-400 hover:text-slate-600"
          >
            <svg x-show="!showPassword" xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
            <svg x-show="showPassword" xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/></svg>
          </button>
        </div>
        <p class="text-right mt-1">
          <a href="#" class="text-xs text-teal-600 hover:underline">¿Olvidaste tus credenciales?</a>
        </p>
      </div>

      <!-- Error message -->
      <p x-show="error" x-text="error" class="text-xs text-red-500 text-center bg-red-50 rounded-lg px-3 py-2"></p>

      <button
        type="submit"
        :disabled="loading"
        class="w-full header-gradient text-white font-semibold py-2.5 rounded-lg text-sm hover:opacity-90 transition disabled:opacity-60"
      >
        <span x-show="!loading">INICIAR SESIÓN</span>
        <span x-show="loading">Verificando...</span>
      </button>

    </form>

    <!-- Footer -->
    <p class="text-center text-xs text-slate-400 pb-5">
      Acceso seguro · Datos cifrados
    </p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
  <script src="../assets/js/api.js"></script>
  <script>
    function loginApp() {
      return {
        email: "",
        password: "",
        showPassword: false,
        loading: false,
        error: "",
        async submit() {
          this.error = "";
          this.loading = true;
          try {
            const data = await api.login(this.email, this.password);
            localStorage.setItem("token", data.access_token);
            window.location.href = "study.html";
          } catch (e) {
            this.error = e.message;
          } finally {
            this.loading = false;
          }
        },
      };
    }
  </script>
</body>
</html>
